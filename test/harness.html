                  per[name] = (per[name] || 0) + 1;
                }
                return orig.apply(this, arguments);
              };
            })(names[n]);
          }
          if (typeof window.__cleanup13 === 'function') window.__cleanup13();
          window.__cleanup14 = fresh();
          Z.fresh = typeof window.__cleanup14;
          window.__pump(6, 40);
          var before = px;
          window.__pump(300, 40);           // 12 秒虚拟时间
          Z.offCalls = calls;
          Z.offPixels = px - before;
          Z.pxPerSec = Math.round((px - before) / 12);
          Z.offCanvases = seen.map(function (t) { return t.w + 'x' + t.h; });
          Z.perOp = per;
          Z.arcPerFrame = arcs();
        } catch (e) { Z.err = 'CAUGHT ' + (e && e.stack ? e.stack : e); }
        out.frameErrors = window.__log.slice(0, 4);
        if (window.__fuzz8) window.__fuzz8(emit7); else emit7();
      };

      // ============ fuzz 第八批：光点运动方式 + 呼吸灯（2026-10-17 用户要求） ============
      window.__fuzz8 = function (emit8) {
        var Z = {}; out.motion = Z;
        try {
          if (typeof window.__cleanup14 === 'function') window.__cleanup14();
          window.__cleanup15 = fresh();
          Z.fresh = typeof window.__cleanup15;
          var gear = document.getElementById('whale-pond-gear'), p = document.getElementById('whale-pond-panel');
          for (var g = 0; g < 4 && p.style.display !== 'block'; g++) gear.click();
          Z.panelOpen = p.style.display;
          var sel = p.querySelector('select.wp-sel');
          Z.selFound = !!sel;
          Z.selOptions = sel ? sel.options.length : 0;
          Z.selDefault = sel ? sel.value : '';
          var cv = document.getElementById('whale-pond-canvas');
          Z.canvasCss = cv ? cv.clientWidth + 'x' + cv.clientHeight : 'none';
          var CX = cv ? cv.clientWidth / 2 : 377, CY = cv ? cv.clientHeight / 2 : 244;

          var fills = 0, P = CanvasRenderingContext2D.prototype, ofill = P.fill;
          P.fill = function () { if (this.canvas && this.canvas.id === 'whale-pond-canvas') fills++; return ofill.apply(this, arguments); };
          function framePts(){ window.__rec = true; window.__pts = []; window.__pump(1, 40); window.__rec = false; return window.__pts.filter(function(t){ return t[2] < 16; }); }
          function dd(P0){ var m = {}, o = []; for (var i = 0; i < P0.length; i++){ var k = Math.round(P0[i][0]) + ',' + Math.round(P0[i][1]); if (!m[k]) { m[k] = 1; o.push(P0[i]); } } return o; }
          function vecs(P0, Q0){
            var A = dd(P0), B = dd(Q0), sx = 0, sy = 0, n = 0, sp = 0, al = 0;
            for (var i = 0; i < A.length; i++){
              var best = 1e9, bi = -1;
              for (var j = 0; j < B.length; j++){
                var dx = A[i][0]-B[j][0], dy = A[i][1]-B[j][1], d2 = dx*dx+dy*dy;
                if (d2 < best){ best = d2; bi = j; }
              }
              if (bi < 0 || best > 400) continue;
              var vx = B[bi][0]-A[i][0], vy = B[bi][1]-A[i][1], vl = Math.sqrt(vx*vx+vy*vy);   // 后一帧 - 前一帧
              if (vl < 0.05) continue;
              sx += vx; sy += vy; n++; sp += vl;
              var tx = -(A[i][1]-CY), ty = (A[i][0]-CX), tl = Math.sqrt(tx*tx+ty*ty)+1;
              al += (vx*tx/tl + vy*ty/tl) / vl;
            }
            return n ? [ +(sx/n).toFixed(2), +(sy/n).toFixed(2), +(sp/n).toFixed(2), +(al/n).toFixed(2), n ] : [0,0,0,0,0];
          }
          function sample(mode){
            sel.value = mode; sel.dispatchEvent(new Event('change'));
            window.__pump(45, 40);
            var sx = 0, sy = 0, sp = 0, sa = 0, c = 0;
            for (var k = 0; k < 10; k++){
              var v = vecs(framePts(), framePts());
              if (v[4] > 30){ sx += v[0]; sy += v[1]; sp += v[2]; sa += v[3]; c++; }
            }
            return c ? { mx: +(sx/c).toFixed(2), my: +(sy/c).toFixed(2), sp: +(sp/c).toFixed(2), al: +(sa/c).toFixed(2), n: c } : { err: 'no samples' };
          }
          Z.drift = sample('drift');
          Z.fall = sample('fall');
          Z.rise = sample('rise');
          Z.current = sample('current');
          Z.swirl = sample('swirl');
          Z.deltas = {
            fall: [ +(Z.fall.mx-Z.drift.mx).toFixed(2), +(Z.fall.my-Z.drift.my).toFixed(2) ],
            rise: [ +(Z.rise.mx-Z.drift.mx).toFixed(2), +(Z.rise.my-Z.drift.my).toFixed(2) ],
            current: [ +(Z.current.mx-Z.drift.mx).toFixed(2), +(Z.current.my-Z.drift.my).toFixed(2) ],
            swirl: [ +(Z.swirl.mx-Z.drift.mx).toFixed(2), +(Z.swirl.my-Z.drift.my).toFixed(2), +(Z.swirl.sp-Z.drift.sp).toFixed(2) ]
          };
          var ls = localStorage.getItem('whale-pond-settings-v1') || '';
          Z.lsMotion = (ls.match(/"motion":"[a-z]+"/) || ['none'])[0];
          sel.value = 'drift'; sel.dispatchEvent(new Event('change')); window.__pump(8, 40);
          function radii(){
            var A = framePts(), m = {}, o = [];
            for (var i = 0; i < A.length; i++){ if (A[i][2] < 20){ var k = Math.round(A[i][2]*100)/100; if (!(k in m)) { m[k] = 1; o.push(k); } } }
            o.sort(function(a,b){ return a-b; });
            return { n: o.length, min: o[0], max: o[o.length-1] };
          }
          var f0 = fills; window.__pump(30, 40); Z.fillPerFrameNoBreathe = +((fills-f0)/30).toFixed(1);
          Z.radiiNoBreathe = radii();
          var boxes = p.querySelectorAll('input[type=checkbox]'), breatheBox = null;
          for (var b = 0; b < boxes.length; b++){ var lab = boxes[b].parentNode ? (boxes[b].parentNode.textContent || '') : ''; if (lab.indexOf('呼吸灯') >= 0) breatheBox = boxes[b]; }
          Z.breatheBoxFound = !!breatheBox;
          if (breatheBox){ breatheBox.checked = true; breatheBox.dispatchEvent(new Event('change')); }
          window.__pump(30, 40);
          Z.radiiBreathe = radii();
          var f1 = fills; window.__pump(30, 40); Z.fillPerFrameBreathe = +((fills-f1)/30).toFixed(1);
          Z.lsBreathe = (localStorage.getItem('whale-pond-settings-v1') || '').indexOf('"breathe":true') >= 0;
          Z.arcPerFrame = arcs();
          Z.badArcs = 0;
          if (breatheBox){ breatheBox.checked = false; breatheBox.dispatchEvent(new Event('change')); }
          sel.value = 'drift'; sel.dispatchEvent(new Event('change'));
          P.fill = ofill;
          window.__pump(2, 40);
        } catch (e) { Z.err = 'CAUGHT ' + (e && e.stack ? e.stack : e); }
        out.frameErrors = window.__log.slice(0, 4);
        emit8();
      };
    }, 60);
  })();
